name: Update posts

on:
  schedule:
    - cron: "7 22 * * *"   # 毎日 7:07（日本時間）。GitHub が混んでいると数分〜数十分遅れます
  workflow_dispatch: {}    # Actions タブの「Run workflow」で今すぐ実行

permissions:
  contents: write

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch posts and rebuild pages
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m xdigest

      # 一部のアカウントでエラーになっても、取れた分は保存する
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .   # __pycache__ などは .gitignore で除外
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -q -m "Update posts $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q
          git push
