name: Test

on:
  push:
    paths: ["xdigest/**", "tests/**", ".github/workflows/test.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
